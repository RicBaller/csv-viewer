<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>CSV Viewer</h1>
    <div class="topbar-end">
    <div class="actions" id="actions" hidden>
      <span id="fileInfo" class="muted"></span>
      <div class="toggle" role="group" data-i18n-aria-label="view">
        <button id="tableViewBtn" type="button" class="secondary" data-i18n="table">Table</button>
        <button id="recordViewBtn" type="button" class="secondary" data-i18n="record">Row</button>
      </div>
      <button id="downloadBtn" type="button" data-i18n="download">Download CSV</button>
      <button id="resetBtn" type="button" class="secondary" data-i18n="newFile">New file</button>
    </div>
    <label class="lang">
      <span data-i18n="language">Language</span>
      <select id="languageSelect"></select>
    </label>
    </div>
  </header>

  <main>
    <section id="dropzone" class="dropzone">
      <p><strong data-i18n="dropTitle">Drag a CSV file here</strong></p>
      <p class="muted" data-i18n="or">or</p>
      <label class="button">
        <span data-i18n="chooseFile">Choose file</span>
        <input type="file" id="fileInput" accept=".csv,.tsv,.txt,text/csv" hidden>
      </label>
    </section>

    <section id="importPanel" class="panel" hidden>
      <h2><span data-i18n="importTitle">Load file:</span> <span id="importName"></span></h2>
      <div class="options">
        <label>
          <input type="checkbox" id="hasHeader" checked>
          <span data-i18n="hasHeader">First row contains column names</span>
        </label>
        <label>
          <span data-i18n="delimiter">Delimiter</span>
          <select id="delimiter">
            <option value="," data-i18n="comma">Comma (,)</option>
            <option value=";" data-i18n="semicolon">Semicolon (;)</option>
            <option value="&#9;" data-i18n="tab">Tab</option>
            <option value="|" data-i18n="pipe">Pipe (|)</option>
          </select>
        </label>
      </div>

      <div id="columnNames" hidden>
        <h3 data-i18n="columnNames">Column names</h3>
        <div id="columnNameInputs" class="column-names"></div>
      </div>

      <h3 data-i18n="preview">Preview</h3>
      <div class="table-wrap preview">
        <table id="previewTable"></table>
      </div>

      <div class="panel-actions">
        <button id="cancelImportBtn" type="button" class="secondary" data-i18n="cancel">Cancel</button>
        <button id="confirmImportBtn" type="button" data-i18n="load">Load</button>
      </div>
    </section>

    <section id="viewer" hidden>
      <p class="muted hint" data-i18n="hint">Click a cell to edit it. Click a column name to rename it.</p>
      <div id="tableTools" class="table-tools">
        <button id="selectToggleBtn" type="button" class="secondary"></button>
        <span id="selectedCount" class="muted" hidden></span>
        <button id="deleteSelectedBtn" type="button" class="secondary danger" data-i18n="deleteSelected" hidden>Delete selected</button>
      </div>
      <div id="tableView" class="table-wrap">
        <table id="dataTable"></table>
      </div>

      <div id="recordView" class="record" hidden>
        <div class="record-nav">
          <button id="prevRowBtn" type="button" class="secondary" data-i18n="prev">← Previous</button>
          <label>
            <span data-i18n="row">Row</span>
            <input type="number" id="rowNumber" min="1" step="1">
            <span id="rowTotal" class="muted"></span>
          </label>
          <button id="nextRowBtn" type="button" class="secondary" data-i18n="next">Next →</button>
          <button id="deleteRecordBtn" type="button" class="secondary danger" data-i18n="deleteRow">Delete row</button>
        </div>
        <div class="table-wrap">
          <table id="recordTable"></table>
        </div>
        <p id="recordEmpty" class="muted" hidden data-i18n="noRows">No rows.</p>
      </div>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="csv.js"></script>
  <script src="app.js"></script>
</body>
</html>
