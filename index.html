<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>CSV Viewer</h1>
    <div class="actions" id="actions" hidden>
      <span id="fileInfo" class="muted"></span>
      <div class="toggle" role="group" aria-label="Weergave">
        <button id="tableViewBtn" type="button" class="secondary">Tabel</button>
        <button id="recordViewBtn" type="button" class="secondary">Rij</button>
      </div>
      <button id="downloadBtn" type="button">Download CSV</button>
      <button id="resetBtn" type="button" class="secondary">Nieuw bestand</button>
    </div>
  </header>

  <main>
    <section id="dropzone" class="dropzone">
      <p><strong>Sleep een CSV-bestand hierheen</strong></p>
      <p class="muted">of</p>
      <label class="button">
        Kies bestand
        <input type="file" id="fileInput" accept=".csv,.tsv,.txt,text/csv" hidden>
      </label>
    </section>

    <section id="importPanel" class="panel" hidden>
      <h2>Bestand inladen: <span id="importName"></span></h2>
      <div class="options">
        <label>
          <input type="checkbox" id="hasHeader" checked>
          Eerste rij bevat kolomnamen
        </label>
        <label>
          Scheidingsteken
          <select id="delimiter">
            <option value=",">Komma (,)</option>
            <option value=";">Puntkomma (;)</option>
            <option value="&#9;">Tab</option>
            <option value="|">Pipe (|)</option>
          </select>
        </label>
      </div>

      <div id="columnNames" hidden>
        <h3>Kolomnamen</h3>
        <div id="columnNameInputs" class="column-names"></div>
      </div>

      <h3>Voorbeeld</h3>
      <div class="table-wrap preview">
        <table id="previewTable"></table>
      </div>

      <div class="panel-actions">
        <button id="cancelImportBtn" type="button" class="secondary">Annuleren</button>
        <button id="confirmImportBtn" type="button">Inladen</button>
      </div>
    </section>

    <section id="viewer" hidden>
      <p class="muted hint">Klik op een cel om te bewerken. Klik op een kolomnaam om die te hernoemen.</p>
      <div id="tableView" class="table-wrap">
        <table id="dataTable"></table>
      </div>

      <div id="recordView" class="record" hidden>
        <div class="record-nav">
          <button id="prevRowBtn" type="button" class="secondary">← Vorige</button>
          <label>
            Rij
            <input type="number" id="rowNumber" min="1" step="1">
            <span id="rowTotal" class="muted"></span>
          </label>
          <button id="nextRowBtn" type="button" class="secondary">Volgende →</button>
          <button id="deleteRecordBtn" type="button" class="secondary danger">Rij verwijderen</button>
        </div>
        <div class="table-wrap">
          <table id="recordTable"></table>
        </div>
        <p id="recordEmpty" class="muted" hidden>Geen rijen.</p>
      </div>
    </section>
  </main>

  <script src="csv.js"></script>
  <script src="app.js"></script>
</body>
</html>
